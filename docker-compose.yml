version: "3.9"

services:
  db:
    build:
      context: ./docker/db
      dockerfile: Dockerfile
    container_name: routing_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
      - ./data/raw:/data/raw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20

  data_builder:
    build:
      context: ./docker/db
      dockerfile: Dockerfile
    container_name: routing_data_builder
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/raw:/data/raw
      - ./database/build:/database/build
      - ./scripts:/scripts
    command: ["bash", "/scripts/setup_data.sh"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: routing_backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      data_builder:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT}:5000"
    volumes:
      - ./backend:/app
    command: ["python", "-m", "app.main"]

  frontend:
    image: nginx:alpine
    container_name: routing_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  postgres_data: